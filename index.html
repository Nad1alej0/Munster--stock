<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#123c2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
  <title>Munster Stock</title>
</head>
<body>
<header>
  <div class="logo"><img src="icon.svg" alt=""></div>
  <div>
    <h1>Munster Stock</h1>
    <p>Control diario de bebidas</p>
  </div>
</header>

<main>
  <section class="panel">
    <div>
      <label for="date">Fecha</label>
      <input id="date" type="date">
    </div>
    <div>
      <label for="shift">Turno</label>
      <select id="shift">
        <option>Mañana</option>
        <option>Noche</option>
      </select>
    </div>
    <div>
      <label for="resp">Responsable</label>
      <input id="resp" placeholder="Nombre">
    </div>
  </section>

  <div class="actions">
    <button class="primary" id="voice">🎤 Dictar conteo</button>
    <button class="danger" id="reset">➕ Nuevo conteo</button>
  </div>

  <div id="voiceStatus"></div>
  <div id="products"></div>

  <section class="summary">
    <h2>Resumen</h2>
    <div class="sumgrid">
      <div><span id="totalProducts">19</span><small>Productos</small></div>
      <div><span id="okc">0</span><small>Correctos</small></div>
      <div><span id="missc">0</span><small>Faltantes</small></div>
      <div><span id="extrac">0</span><small>Sobrantes</small></div>
    </div>
  </section>

  <div class="actions bottom">
    <button class="secondary" id="share">📲 Compartir por WhatsApp</button>
  </div>

  <footer>Munster Stock v1.0</footer>
</main>

<script src="app.js"></script>
</body>
</html>
